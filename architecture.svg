<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title description">
  <title id="title">AWS highly available service dashboard architecture</title>
  <desc id="description">An Application Load Balancer routes browser requests to Python dashboard instances in two Availability Zones. Auto Scaling replaces unhealthy instances. The instances invoke Lambda to atomically update a DynamoDB visit total and fetch the application bundle from a private encrypted S3 bucket.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#536579"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #17324d; }
      .heading { font-size: 18px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; fill: #42576c; }
      .box { stroke-width: 2; rx: 10; }
      .flow { fill: none; stroke: #536579; stroke-width: 2; marker-end: url(#arrow); }
      .artifact { fill: none; stroke: #8a68ad; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-purple); }
    </style>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8a68ad"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#fff"/>
  <text x="460" y="34" text-anchor="middle" class="heading">AWS Highly Available Service Dashboard</text>

  <rect x="35" y="78" width="150" height="64" class="box" fill="#e8f1fc" stroke="#6596d2"/>
  <text x="110" y="106" text-anchor="middle" class="label">Browser</text>
  <text x="110" y="127" text-anchor="middle" class="small">Dashboard + status polls</text>

  <rect x="255" y="78" width="230" height="64" class="box" fill="#e8f1fc" stroke="#6596d2"/>
  <text x="370" y="105" text-anchor="middle" class="label">Application Load Balancer</text>
  <text x="370" y="127" text-anchor="middle" class="small">Public HTTP · target health checks</text>
  <path d="M185 110 H250" class="flow"/>

  <rect x="35" y="180" width="650" height="278" class="box" fill="#f3f8f5" stroke="#72aa90"/>
  <text x="55" y="207" class="heading">Application VPC · Multi-AZ Auto Scaling</text>

  <rect x="60" y="230" width="275" height="195" class="box" fill="#edf4fc" stroke="#7da8d7"/>
  <text x="197" y="258" text-anchor="middle" class="label">Availability Zone 1</text>
  <rect x="90" y="282" width="215" height="96" class="box" fill="#fff" stroke="#7da8d7"/>
  <text x="197" y="311" text-anchor="middle" class="label">EC2 dashboard instance</text>
  <text x="197" y="334" text-anchor="middle" class="small">Instance ID · zone · uptime</text>
  <text x="197" y="354" text-anchor="middle" class="small">In-memory per-instance metrics</text>

  <rect x="385" y="230" width="275" height="195" class="box" fill="#edf4fc" stroke="#7da8d7"/>
  <text x="522" y="258" text-anchor="middle" class="label">Availability Zone 2</text>
  <rect x="415" y="282" width="215" height="96" class="box" fill="#fff" stroke="#7da8d7"/>
  <text x="522" y="311" text-anchor="middle" class="label">EC2 dashboard instance</text>
  <text x="522" y="334" text-anchor="middle" class="small">Instance ID · zone · uptime</text>
  <text x="522" y="354" text-anchor="middle" class="small">In-memory per-instance metrics</text>

  <path d="M370 142 V166 H197 V277" class="flow"/>
  <path d="M370 166 H522 V277" class="flow"/>

  <rect x="735" y="78" width="150" height="72" class="box" fill="#fff3df" stroke="#d0a45e"/>
  <text x="810" y="106" text-anchor="middle" class="label">Counter Lambda</text>
  <text x="810" y="128" text-anchor="middle" class="small">Atomic visit increment</text>
  <rect x="735" y="165" width="150" height="56" class="box" fill="#fff3df" stroke="#d0a45e"/>
  <text x="810" y="190" text-anchor="middle" class="label">DynamoDB</text>
  <text x="810" y="209" text-anchor="middle" class="small">Persistent global total</text>
  <path d="M660 314 H710 V114 H730" class="flow"/>
  <path d="M810 150 V160" class="flow"/>

  <rect x="735" y="235" width="150" height="78" class="box" fill="#f3eefa" stroke="#9a79b7"/>
  <text x="810" y="265" text-anchor="middle" class="label">Private S3</text>
  <text x="810" y="287" text-anchor="middle" class="small">Encrypted app bundle</text>
  <path d="M735 275 H705 V330 H635" class="artifact"/>
  <text x="715" y="258" text-anchor="middle" class="small">Bootstrap fetch</text>

  <rect x="735" y="350" width="150" height="72" class="box" fill="#fff3df" stroke="#d0a45e"/>
  <text x="810" y="378" text-anchor="middle" class="label">Auto Scaling</text>
  <text x="810" y="400" text-anchor="middle" class="small">Replace unhealthy EC2</text>
  <path d="M685 386 H730" class="flow"/>

  <text x="460" y="480" text-anchor="middle" class="small">The dashboard reports the instance answering each request; AWS consoles show target health and replacement activity.</text>
</svg>
