<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title description">
  <title id="title">Highly available AWS web application architecture</title>
  <desc id="description">An internet-facing load balancer routes requests to EC2 instances in two public Availability Zone subnets. The application invokes Lambda, which updates a DynamoDB visitor counter.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#536579"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #17324d; }
      .heading { font-size: 17px; font-weight: 700; }
      .label { font-size: 14px; }
      .small { font-size: 12px; fill: #42576c; }
      .box { stroke-width: 2; rx: 10; }
      .flow { fill: none; stroke: #536579; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="800" height="500" fill="#fff"/>
  <text x="400" y="32" text-anchor="middle" class="heading">AWS Highly Available Web Application</text>

  <rect x="35" y="70" width="150" height="58" class="box" fill="#e8f1fc" stroke="#6596d2"/>
  <text x="110" y="95" text-anchor="middle" class="label">Internet users</text>
  <text x="110" y="115" text-anchor="middle" class="small">HTTP requests</text>

  <rect x="260" y="70" width="210" height="58" class="box" fill="#e8f1fc" stroke="#6596d2"/>
  <text x="365" y="95" text-anchor="middle" class="label">Application Load Balancer</text>
  <text x="365" y="115" text-anchor="middle" class="small">Public · HTTP port 80</text>
  <path d="M185 99 H255" class="flow"/>

  <rect x="35" y="165" width="540" height="270" class="box" fill="#f3f8f5" stroke="#72aa90"/>
  <text x="55" y="191" class="heading">VPC · two Availability Zones · public subnets</text>

  <rect x="60" y="215" width="230" height="190" class="box" fill="#edf4fc" stroke="#7da8d7"/>
  <text x="175" y="242" text-anchor="middle" class="label">Availability Zone 1</text>
  <rect x="85" y="275" width="180" height="78" class="box" fill="#fff" stroke="#7da8d7"/>
  <text x="175" y="307" text-anchor="middle" class="label">EC2 instance</text>
  <text x="175" y="329" text-anchor="middle" class="small">Python web application</text>

  <rect x="320" y="215" width="230" height="190" class="box" fill="#edf4fc" stroke="#7da8d7"/>
  <text x="435" y="242" text-anchor="middle" class="label">Availability Zone 2</text>
  <rect x="345" y="275" width="180" height="78" class="box" fill="#fff" stroke="#7da8d7"/>
  <text x="435" y="307" text-anchor="middle" class="label">EC2 instance</text>
  <text x="435" y="329" text-anchor="middle" class="small">Python web application</text>

  <path d="M365 128 V154 H175 V270" class="flow"/>
  <path d="M365 154 H435 V270" class="flow"/>

  <rect x="625" y="190" width="145" height="72" class="box" fill="#fff3df" stroke="#d0a45e"/>
  <text x="697" y="220" text-anchor="middle" class="label">AWS Lambda</text>
  <text x="697" y="241" text-anchor="middle" class="small">Visitor counter</text>

  <rect x="625" y="330" width="145" height="72" class="box" fill="#fff3df" stroke="#d0a45e"/>
  <text x="697" y="360" text-anchor="middle" class="label">DynamoDB</text>
  <text x="697" y="381" text-anchor="middle" class="small">Atomic visit count</text>

  <path d="M265 314 H605 V226 H620" class="flow"/>
  <path d="M525 314 H605 V238 H620" class="flow"/>
  <path d="M697 262 V325" class="flow"/>
</svg>
