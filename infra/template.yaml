AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS capstone: two-AZ ALB, EC2 Auto Scaling, Lambda and DynamoDB visitor counter'
Parameters:
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.micro
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref VPC, InternetGatewayId: !Ref InternetGateway}
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VPC}
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties: {RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref VPC, CidrBlock: 10.20.1.0/24, AvailabilityZone: !Select [0, !GetAZs ''], MapPublicIpOnLaunch: true}
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref VPC, CidrBlock: 10.20.2.0/24, AvailabilityZone: !Select [1, !GetAZs ''], MapPublicIpOnLaunch: true}
  Association1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable}
  Association2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable}
  ALBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from internet
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
  WebSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow web only from ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref ALBSG}
  CounterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: counter_id, AttributeType: S}
      KeySchema:
        - {AttributeName: counter_id, KeyType: HASH}
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: UpdateCounter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'dynamodb:UpdateItem', Resource: !GetAtt CounterTable.Arn}
  CounterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 10
      Environment:
        Variables: {TABLE_NAME: !Ref CounterTable}
      Code:
        ZipFile: |
          import os, boto3
          db = boto3.client('dynamodb')
          def handler(event, context):
              response = db.update_item(
                  TableName=os.environ['TABLE_NAME'],
                  Key={'counter_id': {'S': 'homepage'}},
                  UpdateExpression='ADD #n :one',
                  ExpressionAttributeNames={'#n': 'visits'},
                  ExpressionAttributeValues={':one': {'N': '1'}},
                  ReturnValues='UPDATED_NEW')
              return {'count': int(response['Attributes']['visits']['N'])}
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: InvokeCounter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'lambda:InvokeFunction', Resource: !GetAtt CounterFunction.Arn}
  EC2Profile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref EC2Role]}
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmi
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Arn: !GetAtt EC2Profile.Arn}
        SecurityGroupIds: [!Ref WebSG]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            dnf install -y python3 python3-pip
            mkdir -p /opt/capstone
            cat > /opt/capstone/server.py <<'PY'
            import os, json, boto3
            from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
            client = boto3.client('lambda', region_name='${AWS::Region}')
            class Handler(BaseHTTPRequestHandler):
                def do_GET(self):
                    if self.path == '/health':
                        self.send_response(200); self.end_headers(); self.wfile.write(b'ok'); return
                    count = 'unavailable'
                    try:
                        result = client.invoke(FunctionName='${CounterFunction}', Payload=b'{}')
                        count = json.loads(result['Payload'].read()).get('count', 'unavailable')
                    except Exception as exc:
                        print(exc, flush=True)
                    html = f'<h1>AWS Highly Available Web App</h1><p>Visitor count: {count}</p><p>EC2 + ALB + ASG + Lambda + DynamoDB</p>'.encode()
                    self.send_response(200); self.send_header('Content-Type','text/html'); self.end_headers(); self.wfile.write(html)
            ThreadingHTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
            PY
            python3 -m pip install --ignore-installed --no-cache-dir boto3
            cat > /etc/systemd/system/capstone.service <<'SERVICE'
            [Unit]
            Description=AWS capstone web server
            After=network-online.target
            [Service]
            ExecStart=/usr/bin/python3 /opt/capstone/server.py
            Restart=always
            [Install]
            WantedBy=multi-user.target
            SERVICE
            systemctl daemon-reload
            systemctl enable --now capstone
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref ALBSG]
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 8080
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /health
      Matcher: {HttpCode: '200'}
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}
  ASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      MinSize: '2'
      DesiredCapacity: '2'
      MaxSize: '4'
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      TargetGroupARNs: [!Ref TargetGroup]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
  ScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref ASG
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification: {PredefinedMetricType: ASGAverageCPUUtilization}
        TargetValue: 60
Outputs:
  WebsiteURL:
    Value: !Sub 'http://${ALB.DNSName}'
  DynamoDBTable:
    Value: !Ref CounterTable
  LambdaFunction:
    Value: !Ref CounterFunction
